[package]
name = "clipdedup"
version = "0.1.0"
edition = "2021"
description = "Windows 剪贴板去重托盘小工具：拦截连续重复复制"
license = "MIT"

[dependencies]
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png"] }
tray-icon = "0.21"
winit = "0.30"
winreg = "0.55"
windows-sys = { version = "0.60", features = ["Win32_System_DataExchange"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
